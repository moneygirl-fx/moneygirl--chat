<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Money Girl Chat Settings</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0b1020;color:#fff;padding:24px}
    .card{max-width:560px;margin:auto;background:#151b2d;padding:22px;border-radius:18px}
    input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #334;background:#0c1220;color:#fff}
    button{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;font-weight:700}
    #status{margin-top:10px;opacity:.8}
  </style>
</head>
<body>
  <div class="card">
    <h2>Money Girl Chat</h2>
    <p>Optional API override. Leave blank to use the GitHub config.</p>
    <input id="api" placeholder="https://your-worker.workers.dev">
    <button id="save">Save</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
